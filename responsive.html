<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>QuizVerse — test responsive (outil de développement)</title>
<style>
  body { margin: 0; background: #111; color: #eee; font: 13px system-ui; padding: 16px; }
  .row { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
  .dev { display: flex; flex-direction: column; gap: 6px; }
  .dev b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: #8f93b8; }
  iframe { border: 1px solid #333; border-radius: 10px; background: #07070f; }
  .p360 { width: 360px; height: 740px; }
  .p390 { width: 390px; height: 844px; }
  .p768 { width: 768px; height: 900px; }
  .p1280 { width: 1280px; height: 800px; }
  iframe[src^="../.."] { border: 0; }
</style>
</head>
<body>
<h3 style="margin:0 0 14px">QuizVerse — contrôle responsive</h3>
<div class="row">
  <div class="dev"><b>360 × 740 — petit mobile</b><iframe class="p360" src="../../#/"></iframe></div>
  <div class="dev"><b>390 × 844 — mobile</b><iframe class="p390" src="../../#/"></iframe></div>
  <div class="dev"><b>768 × 900 — tablette</b><iframe class="p768" src="../../#/"></iframe></div>
  <div class="dev"><b>1280 × 800 — laptop</b><iframe class="p1280" src="../../#/"></iframe></div>
</div>
</body>
</html>
